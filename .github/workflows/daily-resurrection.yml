name: Daily Resurrection

on:
  schedule:
    # 09:00 US Eastern (approx) Monday–Friday — single daily run
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Repo-scoped token for checkout / commit / push and reading public APIs.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  # PAT with public_repo (or fine-grained Issues: Write) for cross-repo comments.
  COMMENT_GITHUB_TOKEN: ${{ secrets.COMMENT_GITHUB_TOKEN }}

jobs:
  resurrect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PoC validation toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq golang-go
          # rustc via rustup for rustc --crate-type lib checks
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -c rustc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run daily pipeline
        run: python scripts/runner.py
        working-directory: ${{ github.workspace }}

      - name: Commit and push changes
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"

          git pull --rebase --autostash --no-edit origin main

          git add -A

          COMMIT_MSG=$(printf 'feat(resurrection): resurrect %s#%s\n\nIssue: %s\nImpact: %s/10  Effort: ~%sh  PoC: %s\nRef: %s' \
            "$ISSUE_REPO" "$ISSUE_NUMBER" "$ISSUE_TITLE" "$IMPACT_SCORE" "$EFFORT_HOURS" "$HAS_POC" "$ISSUE_URL")

          git diff --cached --quiet || git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3; do
            git push origin main && break
            echo "Push attempt $attempt failed, pulling and retrying..."
            git pull --rebase --autostash --no-edit origin main
          done

      - name: Slack digest on success
        if: success()
        env:
          SLACK_WEBHOOK_AI_PIPELINES: ${{ secrets.SLACK_WEBHOOK_AI_PIPELINES }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
          IMPACT_SCORE: ${{ env.IMPACT_SCORE }}
          ISSUE_URL: ${{ env.ISSUE_URL }}
          ISSUE_REPO: ${{ env.ISSUE_REPO }}
        run: |
          if [ -z "$SLACK_WEBHOOK_AI_PIPELINES" ]; then exit 0; fi
          python scripts/slack_notify.py --digest \
            --title "Resurrection Lab" \
            --text "*${ISSUE_REPO}* — ${ISSUE_TITLE}\nImpact: ${IMPACT_SCORE}/10\n<${ISSUE_URL}|View issue>" \
            --webhook-env SLACK_WEBHOOK_AI_PIPELINES

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
